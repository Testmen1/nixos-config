name: Fetch and Split Qwen 9B
on: workflow_dispatch

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download GGUF from Hugging Face
        # (Remplacez l'URL par le lien de téléchargement direct exact du fichier Q6_K)
        run: wget -O model.gguf https://huggingface.co/Smoffyy/Qwen3.5-9B-Instruct-Pure-GGUF/resolve/main/qwen3.5-9b-instruct-pure-q6_k.gguf
        
      - name: Split into 1.9GB chunks
        run: split -b 1900M model.gguf qwen_part_
        
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "qwen-9b-parts"
          files: qwen_part_*
