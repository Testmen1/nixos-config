name: Fetch and Split Qwen 3.5 9B
on: workflow_dispatch

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Download Instruct GGUF
        run: wget -O model.gguf https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf
        
      - name: Split into 1.9GB chunks
        run: split -b 1900M model.gguf qwen_part_
        
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "qwen-3.5-9b-instruct"
          files: qwen_part_*
