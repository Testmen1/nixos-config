name: Fetch Qwen Model
on: workflow_dispatch

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download GGUF from Hugging Face
        run: wget -O model.gguf https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf
        
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "qwen-3b-q4"
          files: model.gguf
